<div *ngIf="hasEvents" class="bg-white rounded-2xl shadow-xl relative overflow-hidden mb-8">
  <!-- Decorative gradient header -->
  <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 via-purple-500 to-orange-500"></div>

  <div class="px-6 py-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center bg-white mt-2 gap-4">
    <div>
      <h3 class="text-xl font-bold text-gray-900 flex items-center">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center mr-3 bg-purple-50 text-purple-600">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
        Upcoming Camps & Clinics
      </h3>
      <p class="mt-1 text-sm text-gray-500 ml-14">
        Register now for our exciting programs
      </p>
    </div>

    <a routerLink="/camps" class="inline-flex items-center px-4 py-2 border border-purple-600 shadow-sm text-sm font-medium rounded-md text-purple-600 bg-white hover:bg-purple-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition-colors duration-150">
      <svg class="mr-2 -ml-1 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
      View All Programs
    </a>
  </div>

  <div class="px-6 pb-6">
    <ul class="space-y-3">
      <li *ngFor="let event of allEvents"
          (click)="openEventRegistration(event)"
          class="bg-white border border-gray-100 rounded-xl shadow-sm hover:shadow-md hover:border-purple-200 transition-all duration-200 cursor-pointer overflow-hidden group">
        <div class="p-4 flex items-center justify-between">
          <div class="flex items-center min-w-0 flex-1">
            <!-- Type Badge with Icon -->
            <div class="flex-shrink-0 rounded-lg p-3 font-bold text-center min-w-[4.5rem] text-white bg-gradient-to-br transition-all"
                 [ngClass]="getEventGradient(event)">
              <ng-container *ngIf="event.type === 'camp'; else clinicIcon">
                <svg class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
                <span class="block text-xs mt-1 uppercase tracking-wide">Camp</span>
              </ng-container>
              <ng-template #clinicIcon>
                <svg class="h-6 w-6 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
                <span class="block text-xs mt-1 uppercase tracking-wide">Clinic</span>
              </ng-template>
            </div>

            <div class="ml-4 truncate">
              <h4 class="text-lg font-semibold text-gray-900 group-hover:text-purple-600 transition-colors truncate">
                {{ event.title }}
              </h4>
              <div class="flex flex-wrap items-center gap-2 mt-1">
                <!-- Date -->
                <span class="inline-flex items-center text-sm text-gray-600">
                  <svg class="mr-1 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  {{ event.dateRange }}
                </span>
                <!-- Time -->
                <span *ngIf="event.time" class="inline-flex items-center text-sm text-gray-600">
                  <svg class="mr-1 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  {{ event.time }}
                </span>
                <!-- Spots -->
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                      [ngClass]="getSpotsClass(event.spotsAvailable)">
                  <svg class="mr-1 h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                  </svg>
                  {{ getSpotsText(event.spotsAvailable) }}
                </span>
              </div>
            </div>
          </div>

          <div class="ml-4 flex-shrink-0">
            <span class="inline-flex items-center justify-center h-10 w-10 rounded-full bg-purple-50 text-purple-600 group-hover:bg-purple-600 group-hover:text-white transition-all">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </span>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
