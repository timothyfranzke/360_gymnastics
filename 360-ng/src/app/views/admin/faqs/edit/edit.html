<div class="p-6 max-w-3xl mx-auto">
  <!-- Header -->
  <div class="mb-6">
    <a routerLink="/admin/faqs" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-4">
      <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to FAQs
    </a>
    <h1 class="text-2xl font-bold text-gray-900">Edit FAQ</h1>
    <p class="text-gray-600 mt-1">Update the FAQ details</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoadingFaq" class="flex justify-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"></div>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="mb-6 bg-green-50 border border-green-200 text-green-800 px-4 py-3 rounded-lg">
    {{ successMessage }}
  </div>

  <!-- Error Message -->
  <div *ngIf="error && !isLoadingFaq" class="mb-6 bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-lg">
    {{ error }}
  </div>

  <!-- Form -->
  <form *ngIf="!isLoadingFaq && faq" [formGroup]="editForm" (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <!-- Category -->
    <div class="mb-6">
      <label for="category_id" class="block text-sm font-medium text-gray-700 mb-1">
        Category <span class="text-red-500">*</span>
      </label>
      <select id="category_id"
              formControlName="category_id"
              class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
              [class.border-red-500]="isFieldInvalid('category_id')"
              [class.border-gray-300]="!isFieldInvalid('category_id')">
        <option value="">Select a category</option>
        <option *ngFor="let category of categories" [value]="category.id">
          {{ category.name }}
        </option>
      </select>
      <p *ngIf="isFieldInvalid('category_id')" class="mt-1 text-sm text-red-500">
        {{ getFieldError('category_id') }}
      </p>
    </div>

    <!-- Question -->
    <div class="mb-6">
      <label for="question" class="block text-sm font-medium text-gray-700 mb-1">
        Question <span class="text-red-500">*</span>
      </label>
      <input type="text"
             id="question"
             formControlName="question"
             placeholder="Enter the question"
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
             [class.border-red-500]="isFieldInvalid('question')"
             [class.border-gray-300]="!isFieldInvalid('question')">
      <p *ngIf="isFieldInvalid('question')" class="mt-1 text-sm text-red-500">
        {{ getFieldError('question') }}
      </p>
    </div>

    <!-- Answer -->
    <div class="mb-6">
      <label for="answer" class="block text-sm font-medium text-gray-700 mb-1">
        Answer <span class="text-red-500">*</span>
      </label>
      <textarea id="answer"
                formControlName="answer"
                rows="6"
                placeholder="Enter the answer"
                class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
                [class.border-red-500]="isFieldInvalid('answer')"
                [class.border-gray-300]="!isFieldInvalid('answer')"></textarea>
      <p *ngIf="isFieldInvalid('answer')" class="mt-1 text-sm text-red-500">
        {{ getFieldError('answer') }}
      </p>
    </div>

    <!-- Display Order & Active Status -->
    <div class="grid grid-cols-2 gap-6 mb-6">
      <div>
        <label for="display_order" class="block text-sm font-medium text-gray-700 mb-1">
          Display Order
        </label>
        <input type="number"
               id="display_order"
               formControlName="display_order"
               min="0"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
        <p class="mt-1 text-sm text-gray-500">Lower numbers appear first</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <div class="flex items-center mt-2">
          <input type="checkbox"
                 id="is_active"
                 formControlName="is_active"
                 class="h-4 w-4 text-orange-500 focus:ring-orange-500 border-gray-300 rounded">
          <label for="is_active" class="ml-2 text-sm text-gray-700">Active</label>
        </div>
        <p class="mt-1 text-sm text-gray-500">Inactive FAQs are hidden from public view</p>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="flex justify-end gap-4 pt-4 border-t border-gray-200">
      <button type="button"
              (click)="cancel()"
              class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
        Cancel
      </button>
      <button type="submit"
              [disabled]="isLoading"
              class="px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!isLoading">Save Changes</span>
        <span *ngIf="isLoading" class="flex items-center">
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Saving...
        </span>
      </button>
    </div>
  </form>
</div>
