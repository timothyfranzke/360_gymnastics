<div class="gallery-overlay fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
     (click)="onOverlayClick($event)">
  <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[80vh] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b">
      <h3 class="text-lg font-semibold text-gray-900">Choose from Gallery</h3>
      <button (click)="onClose()" class="text-gray-400 hover:text-gray-600">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-4">
      <div *ngIf="isLoading" class="text-center py-12">
        <svg class="animate-spin h-8 w-8 text-orange-500 mx-auto" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <p class="mt-2 text-gray-500">Loading gallery...</p>
      </div>

      <div *ngIf="!isLoading && images.length === 0" class="text-center py-12">
        <p class="text-gray-500">No gallery images available.</p>
      </div>

      <div *ngIf="!isLoading && images.length > 0"
           class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
        <button *ngFor="let image of images"
                (click)="selectImage(image)"
                class="gallery-thumb aspect-square rounded-lg overflow-hidden border-2 border-transparent hover:border-orange-500 transition-all focus:outline-none focus:ring-2 focus:ring-orange-500">
          <img [src]="image.thumbnail_url || image.url"
               [alt]="image.alt_text || 'Gallery image'"
               class="w-full h-full object-cover">
        </button>
      </div>
    </div>
  </div>
</div>
