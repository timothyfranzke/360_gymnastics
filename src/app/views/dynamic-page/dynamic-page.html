<app-header></app-header>

<!-- Loading -->
<div *ngIf="isLoading" class="min-h-screen flex items-center justify-center">
  <div class="text-center">
    <svg class="animate-spin h-10 w-10 text-orange-500 mx-auto" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <p class="mt-3 text-gray-500">Loading...</p>
  </div>
</div>

<!-- Not Found -->
<div *ngIf="!isLoading && notFound">
  <app-view-header title="Page Not Found" description="The page you're looking for doesn't exist."></app-view-header>
  <section class="bg-gray-50 py-16">
    <div class="container mx-auto px-6 text-center">
      <p class="text-gray-500 mb-6">This page may have been removed or the URL is incorrect.</p>
      <a routerLink="/" class="text-orange-600 hover:text-orange-500 font-medium">Go to Homepage</a>
    </div>
  </section>
</div>

<!-- Page Content -->
<div *ngIf="!isLoading && !notFound && page">
  <app-view-header [title]="page.title"></app-view-header>
  <section class="bg-gray-50 py-12">
    <div class="container mx-auto px-6 max-w-4xl">
      @for (block of page.content; track block.id) {
        <app-page-block-renderer [block]="block"></app-page-block-renderer>
      }
    </div>
  </section>
</div>

<app-footer></app-footer>
