<div class="faq-page">
  <app-view-header
    title="Frequently Asked Questions"
    subtitle="Find answers to common questions about 360 Gym">
  </app-view-header>

  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- Search Bar -->
    <div class="mb-8" @fadeIn>
      <div class="relative">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (input)="onSearch()"
          placeholder="Search FAQs..."
          class="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg shadow-sm
                 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500
                 text-lg">
        <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 h-5 w-5 text-gray-400"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <button *ngIf="searchQuery"
                (click)="clearSearch()"
                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"></div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="bg-red-50 border border-red-200 rounded-lg p-6 text-center">
      <p class="text-red-700 mb-4">{{ error }}</p>
      <button (click)="retryLoad()" class="btn-primary">Try Again</button>
    </div>

    <!-- Search Results -->
    <div *ngIf="isSearching && !loading" class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">
        Search Results ({{ searchResults.length }})
      </h2>

      <div *ngIf="searchResults.length === 0" class="text-center py-8 text-gray-500">
        No FAQs found matching "{{ searchQuery }}"
      </div>

      <div *ngFor="let faq of searchResults" class="faq-item" @fadeIn>
        <button
          (click)="toggleFaq(faq.id)"
          class="w-full text-left px-6 py-4 bg-white rounded-lg shadow-sm border border-gray-200
                 hover:border-orange-300 focus:outline-none focus:ring-2 focus:ring-orange-500
                 transition-all duration-200">
          <div class="flex justify-between items-center">
            <span class="font-medium text-gray-900">{{ faq.question }}</span>
            <svg [class.rotate-180]="isFaqExpanded(faq.id)"
                 class="h-5 w-5 text-gray-500 transform transition-transform duration-200"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
          <span class="text-sm text-orange-600">{{ faq.category_name }}</span>
        </button>

        <div [@expandCollapse]="isFaqExpanded(faq.id) ? 'expanded' : 'collapsed'"
             class="bg-gray-50 px-6 py-4 rounded-b-lg border-x border-b border-gray-200">
          <p class="text-gray-700 whitespace-pre-wrap">{{ faq.answer }}</p>
        </div>
      </div>
    </div>

    <!-- FAQ Categories -->
    <div *ngIf="!isSearching && !loading && !error" class="space-y-6">
      <div *ngFor="let category of categories; let i = index"
           class="faq-category"
           @fadeIn>

        <!-- Category Header -->
        <button
          (click)="setActiveCategory(category.slug)"
          class="w-full text-left px-6 py-4 bg-gradient-to-r from-orange-500 to-orange-600
                 text-white rounded-lg shadow-md hover:from-orange-600 hover:to-orange-700
                 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2
                 transition-all duration-200">
          <div class="flex justify-between items-center">
            <div>
              <h2 class="text-xl font-bold">{{ category.name }}</h2>
              <p class="text-orange-100 text-sm">{{ category.faqs.length }} questions</p>
            </div>
            <svg [class.rotate-180]="isCategoryActive(category.slug)"
                 class="h-6 w-6 transform transition-transform duration-200"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </button>

        <!-- Category FAQs -->
        <div *ngIf="isCategoryActive(category.slug)" class="mt-2 space-y-2">
          <div *ngFor="let faq of category.faqs" class="faq-item">
            <button
              (click)="toggleFaq(faq.id)"
              class="w-full text-left px-6 py-4 bg-white rounded-lg shadow-sm border border-gray-200
                     hover:border-orange-300 focus:outline-none focus:ring-2 focus:ring-orange-500
                     transition-all duration-200">
              <div class="flex justify-between items-center">
                <span class="font-medium text-gray-900">{{ faq.question }}</span>
                <svg [class.rotate-180]="isFaqExpanded(faq.id)"
                     class="h-5 w-5 text-gray-500 transform transition-transform duration-200 flex-shrink-0 ml-4"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            </button>

            <div [@expandCollapse]="isFaqExpanded(faq.id) ? 'expanded' : 'collapsed'"
                 class="bg-gray-50 px-6 py-4 rounded-b-lg border-x border-b border-gray-200">
              <p class="text-gray-700 whitespace-pre-wrap">{{ faq.answer }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && !error && categories.length === 0"
         class="text-center py-12 text-gray-500">
      <svg class="mx-auto h-16 w-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p class="text-lg">No FAQs available at this time.</p>
    </div>
  </div>
</div>
